name: tradedirect
description: "TradeDirect — a simulated trading app for 10 NSE stocks with a mock live market feed."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management — per-symbol providers + .select for surgical rebuilds
  flutter_riverpod: ^2.6.1

  # Persistence — JSON maps in Hive boxes, no codegen
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

  # Routing
  go_router: ^17.5.0

  # Money — arbitrary-precision decimal arithmetic, never doubles
  decimal: ^3.2.6

  # Exact-rational multiplication for cost-basis reduction on partial sells
  rational: ^2.2.3

  # IDs for watchlists and orders
  uuid: ^4.6.0

  # INR formatting with Indian lakh/crore digit grouping
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Deterministic time control for testing the tick coalescer
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
